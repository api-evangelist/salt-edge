description: >-
  Salt Edge is a global open-banking aggregator providing account information, payment
  initiation, data enrichment, merchant identification, AML transaction monitoring, and
  open-banking compliance solutions across 5,000+ banks. The Salt Edge API exposes Account
  Information (AIS) and Payment Initiation (PIS) services plus add-on Data Enrichment and AML
  endpoints under a single REST surface.
apis:
  - aid: salt-edge:account-information-api
    name: Salt Edge Account Information API
    tags:
      - PSD2
      - AISP
      - Account Information
      - Aggregation
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://www.saltedge.com/api/v5
    humanURL: https://docs.saltedge.com/account_information/v5/
    description: REST API for retrieving end-user accounts, transactions, balances, and identity across 5,000+ banks worldwide.
    properties:
      - type: Documentation
        url: https://docs.saltedge.com/account_information/v5/
    x-features:
      - 5,000+ banks across EU, UK, US, APAC, LATAM
      - Accounts, transactions, balances, holder identity
      - PSD2 AISP-licensed
    x-use-cases:
      - PFM and budgeting
      - Lending decisioning
      - KYC enrichment
  - aid: salt-edge:payment-initiation-api
    name: Salt Edge Payment Initiation API
    tags:
      - PSD2
