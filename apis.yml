      - SaaS
    image: https://kinlane-productions2.s3.amazonaws.com/apis-json/apis-json-logo.jpg
    baseURL: https://www.saltedge.com/api/partners/v1
    humanURL: https://docs.saltedge.com/compliance_solution/
