specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Salt Edge
providerId: salt-edge
created: '2026-05-08'
modified: '2026-05-08'
reconciled: false
tags:
  - Open Banking
  - Plans
description: >-
  Salt Edge offers a free Sandbox tier (developer fixtures, full feature surface) and sales-led
  Production contracts. Production pricing is per consented end-user (Account Information),
  per initiated payment (Payment Initiation), or flat-fee SaaS (Compliance Solution / AML).
notes: Salt Edge does not publish list pricing.
sources:
  - https://www.saltedge.com/pricing
  - https://docs.saltedge.com/
plans:
  - id: salt-edge-sandbox
    name: Sandbox / Developer
    type: trial
    description: Free developer sandbox with simulated banks for testing.
    entries:
      - label: Subscription
        name: sandbox_subscription
        type: subscription
        metric: month
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Simulated bank fixtures
      - name: All product surfaces
  - id: salt-edge-account-information
    name: Account Information (Production)
    type: enterprise
    description: Per consented end-user pricing for AISP service.
    entries:
      - label: Custom pricing
        name: ais_custom
        type: subscription
        metric: contract
        limit: -1
        timeFrame: contract
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: true
    elements:
      - name: Per-consented-user
      - name: PSD2 AISP
  - id: salt-edge-payment-initiation
    name: Payment Initiation (Production)
    type: enterprise
    description: Per initiated payment pricing for PISP service.
    entries:
      - label: Custom pricing
        name: pis_custom
        type: usage
        metric: payment
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Per-payment
      - name: PSD2 PISP
  - id: salt-edge-compliance
    name: Compliance Solution
    type: enterprise
    description: SaaS for banks needing PSD2 / open-banking compliance gateway.
    entries:
      - label: Custom pricing
        name: compliance_custom
        type: subscription
        metric: contract
        limit: -1
        timeFrame: contract
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
    elements:
      - name: Compliance gateway
      - name: TPP verification
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
