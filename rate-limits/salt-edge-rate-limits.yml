specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Salt Edge
providerId: salt-edge
created: '2026-05-08'
modified: '2026-05-08'
reconciled: false
tags:
  - Open Banking
  - Rate Limiting
description: >-
  Salt Edge rate limits are negotiated per contract; sandbox keys are typically capped at 60
  requests per minute. The PSD2 SCA cadence applies (typically 4 silent refreshes per consented
  user per 24h, with SCA required beyond). Throttled requests return HTTP 429.
notes: No public rate-limit table; figures are commercial-contract typical.
sources:
  - https://docs.saltedge.com/
responseCodes:
  throttled: 429
limits:
  - name: Sandbox per-minute
    scope: client
    metric: requests_per_minute
    limit: 60
  - name: Production per-minute
    scope: client
    metric: requests_per_minute
    limit: -1
    notes: Per contract.
  - name: PSD2 SCA refresh per user
    scope: end_user
    metric: refreshes_per_day
    limit: 4
    notes: SCA required for 5th and beyond.
policies:
  - name: SCA Compliance
    description: Honor PSD2 SCA cadence; trigger SCA flow when refresh limit is reached.
  - name: Backoff Strategy
    description: Honor 429 Retry-After and apply exponential backoff with jitter.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
